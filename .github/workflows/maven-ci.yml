name: maven-ci

on:
  push:
    branches: [main, develop, qa, staging, release, "feature/**", "chore/**"]
    paths:
      - "pom.xml"
      - ".mvn/**"
      - "maven/**"
      - ".github/workflows/maven-ci.yml"
  pull_request:
    paths:
      - "pom.xml"
      - ".mvn/**"
      - "maven/**"
      - ".github/workflows/maven-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven reactor verify
        run: mvn -B -ntp verify
